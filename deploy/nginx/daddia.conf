# /etc/nginx/sites-available/daddia.conf  (lien symbolique dans sites-enabled)
# Certificat : sudo certbot --nginx -d daddia.fr -d www.daddia.fr

server {
  listen 80;
  server_name daddia.fr www.daddia.fr;
  return 301 https://daddia.fr$request_uri;
}

server {
  listen 443 ssl http2;
  server_name daddia.fr www.daddia.fr;
  ssl_certificate     /etc/letsencrypt/live/daddia.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/daddia.fr/privkey.pem;

  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    # Nginx est le seul point d'entrée : on transmet l'IP réelle du client et on écrase
    # tout X-Forwarded-For envoyé par le navigateur (sinon la limitation par IP serait contournable).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }
}
